name: lotto-watch

on:
  schedule:
    # Every day at 13:17 UTC = 9:17 am Toronto in summer (EDT), 8:17 am in winter (EST).
    # Daily (not just after draws) so Super Draw announcements and day-of reminders are caught.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry-run | test-notify"
        default: "run"

permissions:
  contents: write   # to commit state.json back so alerts aren't repeated

concurrency:
  group: lotto-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional tuning (repo Settings > Secrets and variables > Actions > Variables)
          LOTTO_MAX_WARN_AT: ${{ vars.LOTTO_MAX_WARN_AT }}
          ALERT_EVERY_CAPPED_DRAW: ${{ vars.ALERT_EVERY_CAPPED_DRAW }}
          HEARTBEAT_WEEKDAY: ${{ vars.HEARTBEAT_WEEKDAY }}
        run: |
          case "${{ github.event.inputs.mode || 'run' }}" in
            dry-run)     python lotto_watch.py --dry-run ;;
            test-notify) python lotto_watch.py --test-notify ;;
            *)           python lotto_watch.py ;;
          esac

      - name: Save state
        if: always()
        run: |
          git config user.name  "lotto-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update lotto-watch state [skip ci]"
          git push
